name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/quality_check.py .
      - run: python3 scripts/evolution_check.py .
      - run: python3 scripts/evaluation_check.py .
      - run: python3 scripts/repository_check.py .
